name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@commonkads'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results
          path: test-results.xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: false
          tags: api-runtime:ci
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.NPM_READ_TOKEN }}
